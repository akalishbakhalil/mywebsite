<style>
:root{--ch:#F3E6D3;--nu:#E5D2B5;--bk:#171513;--au:#B08A45;--iv:#FFFCF7;--plate:#E9D3BC;--bd:rgba(176,138,69,.45);--sh:0 10px 30px rgba(23,21,19,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ch:#F3E6D3;--nu:#E5D2B5;--bk:#171513;--au:#B08A45;--iv:#FFFCF7}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
body{background:var(--iv);color:var(--bk);font:400 16px/1.6 Jost,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;line-height:1.1}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--au);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.bar{background:var(--bk);color:var(--ch);text-align:center;font-size:13px;letter-spacing:.08em;padding:8px 12px}
header{position:sticky;top:0;z-index:20;background:rgba(255,252,247,.96);border-bottom:1px solid var(--bd);backdrop-filter:blur(8px)}
.nav{display:flex;align-items:center;gap:20px;height:72px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:54px;width:auto;border:1px solid var(--bd);display:block}
.brand b{font:600 20px 'Cormorant Garamond',serif;letter-spacing:.12em;line-height:1}
.brand small{display:block;font-size:10px;letter-spacing:.22em;color:var(--au)}
nav{margin-left:auto;display:flex;gap:22px;font-size:14px}
nav a{padding:4px 0;border-bottom:1px solid transparent}nav a:hover,nav a.on{border-color:var(--au);color:var(--au)}
.cartb{border:1px solid var(--au);background:none;padding:7px 14px;cursor:pointer;color:var(--bk)}
.cartb:hover{background:var(--au);color:var(--iv)}
.burger{display:none;background:none;border:1px solid var(--bd);padding:7px 11px;cursor:pointer}
.btn{display:inline-block;border:1px solid var(--bk);background:var(--bk);color:var(--iv);padding:13px 28px;cursor:pointer;letter-spacing:.08em;font-size:14px;transition:.25s}
.btn:hover{background:var(--au);border-color:var(--au)}
.btn.o{background:none;color:var(--bk);border-color:var(--au)}.btn.o:hover{background:var(--au);color:var(--iv)}
.btn.wa{background:#1f6b3a;border-color:#1f6b3a}.btn.wa:hover{background:#17542d}
section{padding:64px 0}
.ttl{text-align:center;margin-bottom:34px}.ttl h2{font-size:clamp(30px,4vw,44px)}
.ttl p{color:#6b5f4d;margin-top:8px}
.orn{display:block;width:140px;height:12px;margin:12px auto 0;border-top:1px solid var(--au);position:relative}
.orn:after{content:"";position:absolute;left:50%;top:-5px;width:8px;height:8px;background:var(--iv);border:1px solid var(--au);transform:translateX(-50%) rotate(45deg)}
.hero{background:var(--ch);padding:0;border-bottom:1px solid var(--bd)}
.hero .wrap{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;min-height:620px;padding-top:40px;padding-bottom:40px}
.hero h1{font-size:clamp(46px,7vw,92px);letter-spacing:-.01em}
.hero p{font:italic 500 clamp(20px,2.4vw,28px) 'Cormorant Garamond',serif;color:#5a4d3a;margin:16px 0 28px}
.hero .bt{display:flex;gap:12px;flex-wrap:wrap}
.frame{position:relative;border:1px solid var(--au);padding:12px;background:var(--plate);box-shadow:var(--sh);max-width:520px;justify-self:center;width:100%}
.frame:before{content:"";position:absolute;inset:6px;border:1px solid var(--bd);pointer-events:none}
.frame img{width:100%;display:block}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.cat{border:1px solid var(--bd);background:var(--ch);padding:28px 18px;text-align:center;font:500 24px 'Cormorant Garamond',serif;transition:.25s;cursor:pointer}
.cat:hover{background:var(--bk);color:var(--ch);border-color:var(--bk)}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.tools input,.tools select{border:1px solid var(--bd);background:#fff;padding:10px 14px;min-width:160px}
.tools input{flex:1;min-width:200px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{border:1px solid var(--bd);background:none;padding:7px 15px;cursor:pointer;font-size:14px}
.chip.on,.chip:hover{background:var(--bk);color:var(--ch);border-color:var(--bk)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.card{background:#fff;border:1px solid var(--bd);display:flex;flex-direction:column;box-shadow:var(--sh)}
.card .im{display:block;background:var(--ch);position:relative;cursor:pointer}
.card .im svg,.gal svg{display:block;width:100%;height:auto}
.tag{position:absolute;top:10px;left:10px;background:var(--bk);color:var(--ch);font-size:11px;letter-spacing:.1em;padding:3px 9px}
.card .in{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:23px}.price{color:var(--au);font-weight:500}
.sw{display:flex;gap:6px}.sw i{width:16px;height:16px;border-radius:50%;border:1px solid var(--bd);display:block}
.card .d{font-size:14px;color:#6b5f4d}.card .btn{margin-top:auto;padding:11px;text-align:center}
.pd{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:start}
.gal .main{border:1px solid var(--au);background:var(--ch)}
.thumbs{display:flex;gap:10px;margin-top:10px}.thumbs button{width:80px;border:1px solid var(--bd);padding:0;background:var(--ch);cursor:pointer}.thumbs button.on{border-color:var(--bk)}
.pd h1{font-size:clamp(32px,4vw,48px)}.pd .price{font-size:26px;margin:8px 0 14px}
.opt{margin:16px 0}.opt b{display:block;font-size:13px;letter-spacing:.08em;margin-bottom:8px}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{border:1px solid var(--bd);background:none;padding:8px 16px;cursor:pointer}.pick button.on{background:var(--bk);color:var(--ch);border-color:var(--bk)}
.pick .cl{display:flex;align-items:center;gap:8px}.pick .cl i{width:14px;height:14px;border-radius:50%;display:block;border:1px solid var(--bd)}
.fab{border-top:1px solid var(--bd);margin-top:20px;padding-top:14px;font-size:15px}
.note{font-size:12px;color:#7a6a4f;margin-top:12px}
table{width:100%;border-collapse:collapse}td,th{padding:12px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
.qty{display:inline-flex;border:1px solid var(--bd)}.qty button{background:none;border:0;width:30px;cursor:pointer}.qty span{width:30px;text-align:center;line-height:30px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:36px;align-items:start}
.box{border:1px solid var(--bd);background:#fff;padding:24px}
form label{display:block;font-size:13px;margin:12px 0 4px}form input,form select,form textarea{width:100%;border:1px solid var(--bd);padding:10px 12px;background:var(--iv)}
.sum div{display:flex;justify-content:space-between;padding:6px 0}.sum .t{border-top:1px solid var(--au);margin-top:8px;font-weight:500;font-size:18px}
.abt{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.abt p{margin-bottom:14px;max-width:60ch}
footer{background:var(--bk);color:var(--ch);padding:56px 0 28px;margin-top:40px}
footer .g{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:32px}
footer img{width:190px;border:1px solid var(--au);display:block}
footer h4{font:500 22px 'Cormorant Garamond',serif;margin-bottom:10px;color:var(--au)}
footer li{list-style:none;margin:6px 0;font-size:14px}footer ul{padding:0}footer a:hover{color:var(--au)}
.soc{display:flex;gap:10px;margin-top:14px}.soc a{width:38px;height:38px;border:1px solid var(--au);display:grid;place-items:center;border-radius:50%}.soc a:hover{background:var(--au)}
.soc svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6}
.copy{border-top:1px solid rgba(176,138,69,.4);margin-top:32px;padding-top:18px;font-size:13px;text-align:center}
.fwa{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:#1f6b3a;color:#fff;border-radius:50px;padding:12px 20px;box-shadow:0 8px 22px rgba(0,0,0,.25);font-size:14px;display:flex;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--bk);color:var(--ch);padding:10px 20px;z-index:40;opacity:0;pointer-events:none;transition:.3s}.toast.on{opacity:1}
.empty{text-align:center;padding:40px;color:#6b5f4d}
@media(max-width:860px){nav{display:none;position:absolute;top:72px;left:0;right:0;background:var(--iv);flex-direction:column;padding:16px 20px;border-bottom:1px solid var(--bd);gap:12px}nav.open{display:flex}.burger{display:block;margin-left:auto}.cartb{margin-left:0}.hero .wrap,.pd,.two,.abt,footer .g{grid-template-columns:1fr}.hero .wrap{min-height:0}.cats{grid-template-columns:1fr 1fr}.brand b{font-size:16px}section{padding:44px 0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

function add(id,color,size){const p=P.find(x=>x.id==id);color=color||p.colors[0];size=size||(p.sizes[0]||"-");const k=id+color+size,e=cart.find(c=>c.k==k);e?e.q++:cart.push({k,id,color,size,q:1});save();toast("Added to cart")}
const match=(p,c)=>c=="all"||p.cat==c||(c=="new"&&p.isNew)||(c=="best"&&p.best)||(c=="trend"&&p.trend);
let F={c:"all",q:"",col:"",sort:""};
function list(){let l=P.filter(p=>match(p,F.c)&&p.name.toLowerCase().includes(F.q.toLowerCase())&&(!F.col||p.colors.includes(F.col)));if(F.sort=="a")l.sort((a,b)=>a.price-b.price);if(F.sort=="d")l.sort((a,b)=>b.price-a.price);
 $("#res").innerHTML=l.length?l.map(card).join(""):'<p class="empty">No products match. Try another filter.</p>'}
function shop(title,cats,sub){F={c:cats[0],q:"",col:"",sort:""};
 return `<section><div class="wrap"><div class="ttl"><h2>${title}</h2><span class="orn"></span>${sub?`<p>${sub}</p>`:""}${CONFIG.sampleNotice?'<p class="note">Sample catalogue: products and prices are placeholders to be replaced.</p>':""}</div>
 ${cats.length>1?`<div class="chips">${cats.map(c=>`<button class="chip ${c==F.c?"on":""}" data-c="${c}">${c=="all"?"All":CATS[c]}</button>`).join("")}</div>`:""}
 <div class="tools"><input id="sq" type="search" placeholder="Search products" aria-label="Search"><select id="sc" aria-label="Colour"><option value="">All colours</option>${Object.keys(COLORS).map(c=>`<option>${c}</option>`).join("")}</select><select id="so" aria-label="Sort"><option value="">Sort: Featured</option><option value="a">Price: low to high</option><option value="d">Price: high to low</option></select></div>
 <div class="grid" id="res"></div></div></section>`}
function bindShop(){list();document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{F.c=b.dataset.c;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x==b));list()});
 $("#sq").oninput=e=>{F.q=e.target.value;list()};$("#sc").onchange=e=>{F.col=e.target.value;list()};$("#so").onchange=e=>{F.sort=e.target.value;list()}}

function product(id){const p=P.find(x=>x.id==id);if(!p)return '<p class="empty">Product not found. <a href="#shop">Back to shop</a></p>';let col=p.colors[0],sz=p.sizes[0]||"-";
 return `<section><div class="wrap"><p class="note"><a href="#shop">Shop</a> / ${CATS[p.cat]||""}</p><div class="pd"><div class="gal"><div class="main" id="gm">${art(p,0)}</div><div class="thumbs">${[0,1,2].map(i=>`<button class="${i?"":"on"}" data-v="${i}" aria-label="View ${i+1}">${art(p,i)}</button>`).join("")}</div></div>
 <div><h1>${p.name}</h1><div class="price">${pk(p.price)}</div><p>${p.desc}</p>
 <div class="opt"><b>COLOUR: <span id="cn">${col}</span></b><div class="pick" id="pc">${p.colors.map((c,i)=>`<button class="${i?"":"on"}" data-c="${c}"><span class="cl"><i style="background:${hex(c)}"></i>${c}</span></button>`).join("")}</div></div>
 ${p.sizes.length?`<div class="opt"><b>SIZE</b><div class="pick" id="ps">${p.sizes.map((s,i)=>`<button class="${i?"":"on"}" data-s="${s}">${s}</button>`).join("")}</div></div>`:'<div class="opt"><b>Unstitched: tailor to your own measurements</b></div>'}
 <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="pa">Add to Cart</button><a class="btn wa" id="pw" target="_blank" rel="noopener">Order on WhatsApp</a></div>
 <div class="fab"><b>Fabric:</b> ${p.fabric}<br><b>Details:</b> ${p.desc}</div>${CONFIG.sampleNotice?'<p class="note">Sample product. Photos, price and availability are placeholders until the real catalogue is added.</p>':""}</div></div></div></section>`}
function bindProduct(id){const p=P.find(x=>x.id==id);if(!p)return;let col=p.colors[0],sz=p.sizes[0]||"-";
 const wa=()=>$("#pw").href=`https://wa.me/${CONFIG.whatsapp}?text=`+encodeURIComponent(`Hello ${CONFIG.brand}, I would like to order: ${p.name}, Colour: ${col}, Size: ${sz}, ${pk(p.price)}`);wa();
 document.querySelectorAll(".thumbs button").forEach(b=>b.onclick=()=>{$("#gm").innerHTML=art(p,+b.dataset.v);document.querySelectorAll(".thumbs button").forEach(x=>x.classList.toggle("on",x==b))});
 document.querySelectorAll("#pc button").forEach(b=>b.onclick=()=>{col=b.dataset.c;$("#cn").textContent=col;document.querySelectorAll("#pc button").forEach(x=>x.classList.toggle("on",x==b));wa()});
 document.querySelectorAll("#ps button").forEach(b=>b.onclick=()=>{sz=b.dataset.s;document.querySelectorAll("#ps button").forEach(x=>x.classList.toggle("on",x==b));wa()});
 $("#pa").onclick=()=>add(id,col,sz)}
const rows=()=>cart.map(c=>({...c,p:P.find(x=>x.id==c.id)})).filter(r=>r.p);
const sub=()=>rows().reduce((a,r)=>a+r.p.price*r.q,0);
function cartPage(){const r=rows();if(!r.length)return '<section><div class="wrap empty"><h2>Your cart is empty</h2><p style="margin:12px 0 20px">Discover the latest collections.</p><a class="btn" href="#shop">Shop Now</a></div></section>';
 return `<section><div class="wrap"><div class="ttl"><h2>Shopping Cart</h2><span class="orn"></span></div><div class="two"><div style="overflow-x:auto"><table>${r.map(x=>`<tr><td><b>${x.p.name}</b><br><small>${x.color}${x.size!="-"?", size "+x.size:""}</small></td><td><span class="qty"><button onclick="qt('${x.k}',-1)" aria-label="Less">-</button><span>${x.q}</span><button onclick="qt('${x.k}',1)" aria-label="More">+</button></span></td><td>${pk(x.p.price*x.q)}</td><td><button class="chip" onclick="qt('${x.k}',-99)">Remove</button></td></tr>`).join("")}</table></div>
 <div class="box sum"><h3>Order summary</h3><div><span>Subtotal</span><span>${pk(sub())}</span></div><div><span>Delivery</span><span>${CONFIG.shipping?pk(CONFIG.shipping):"Confirmed at checkout"}</span></div><div class="t"><span>Total</span><span>${pk(sub()+CONFIG.shipping)}</span></div><a class="btn" style="display:block;text-align:center;margin-top:14px" href="#checkout">Proceed to Checkout</a></div></div></div></section>`}
function qt(k,d){const c=cart.find(x=>x.k==k);if(!c)return;c.q+=d;if(c.q<1)cart=cart.filter(x=>x.k!=k);save();route()}
function checkout(){const r=rows();if(!r.length)return cartPage();
 return `<section><div class="wrap"><div class="ttl"><h2>Checkout</h2><span class="orn"></span></div><div class="two"><form class="box" id="cf"><h3>Delivery details</h3>
 <label>Full name<input name="n" required autocomplete="name"></label><label>Phone / WhatsApp<input name="t" required type="tel" autocomplete="tel"></label><label>Email (optional)<input name="e" type="email"></label><label>Full address<textarea name="a" rows="3" required></textarea></label><label>City<input name="c" required></label>
 <label>Payment method<select name="m"><option>Cash on delivery</option><option>Bank transfer (details sent on WhatsApp)</option><option>Easypaisa / JazzCash (details sent on WhatsApp)</option></select></label>
 <button class="btn wa" style="width:100%;margin-top:18px">Place Order via WhatsApp</button><p class="note">No card details are collected on this page. Orders are confirmed with you on WhatsApp. Online card payments can be added through a certified payment gateway (see publishing guide).</p></form>
 <div class="box sum"><h3>Your order</h3>${r.map(x=>`<div><span>${x.p.name} x${x.q}</span><span>${pk(x.p.price*x.q)}</span></div>`).join("")}<div class="t"><span>Total</span><span>${pk(sub()+CONFIG.shipping)}</span></div></div></div></div></section>`}
function bindCheckout(){const f=$("#cf");if(!f)return;f.onsubmit=e=>{e.preventDefault();const d=new FormData(f),r=rows();
 const m=`New order, ${CONFIG.brand}\n\n`+r.map(x=>`- ${x.p.name} | ${x.color}${x.size!="-"?" | "+x.size:""} | x${x.q} | ${pk(x.p.price*x.q)}`).join("\n")+`\n\nTotal: ${pk(sub()+CONFIG.shipping)}\nName: ${d.get("n")}\nPhone: ${d.get("t")}\nEmail: ${d.get("e")||"-"}\nAddress: ${d.get("a")}, ${d.get("c")}\nPayment: ${d.get("m")}`;
 window.open(`https://wa.me/${CONFIG.whatsapp}?text=`+encodeURIComponent(m),"_blank");cart=[];save();$("#app").innerHTML='<section><div class="wrap empty"><h2>Thank you</h2><p style="margin:12px 0 20px">Your order message is ready in WhatsApp. Send it to confirm your order.</p><a class="btn" href="#home">Continue Shopping</a></div></section>'}}

 else if(h=="new")x=shop("New Arrivals",["new"],"The latest additions to the collection.");
 else if(h=="suits")x=shop("Suits Collection",["luxury","three","two","unstitched"].length?["all","luxury","unstitched","two","three"]:[]);
 else if(h=="abaya")x=shop("Abaya Collection",["abaya"],"Modest, graceful and finished with gold.");
 else if(h.startsWith("p-"))x=product(h.slice(2));else if(h=="cart")x=cartPage();else if(h=="checkout")x=checkout();else if(h=="about")x=about();else if(h=="contact")x=contact();else x=home();
